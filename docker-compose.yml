name: mypage

services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: dockerfile
    hostname: 0.0.0.0
    ports:
      - '4242:4242'
    environment:
      - ENVIRONMENT=dev
    develop:
      watch:
        - action: sync
          path:  ./app
          target: /app
    command: deno run --allow-net --allow-read --allow-write=./src --allow-env --allow-run ./src/server.ts
    restart: unless-stopped
